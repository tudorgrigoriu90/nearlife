# Onboarding with location allowed, standing at Gamla Evedal in Kronoberg (T-367). The spot pairs a
# park and a bathing place 2 m apart, so land and freshwater species can both be caught there.
appId: com.nearlife.nearby
---
- setLocation:
    latitude: 56.923688
    longitude: 14.819299
- launchApp:
    clearState: true
    permissions:
      all: allow
# A cold start on the emulator can take longer than Maestro's default wait (run 4, 2026-11-20).
- takeScreenshot: e2e-shots/launch
- extendedWaitUntil:
    visible: "Get started"
    timeout: 60000
- tapOn: "Get started"
- tapOn:
    text: "Year of birth.*"
- inputText: "1990"
# The keyboard covers the button on a phone-sized screen (first run, 2026-11-20).
- hideKeyboard
- tapOn: "Continue"
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Confirm Kronoberg"
    timeout: 30000
- tapOn: "Confirm Kronoberg"
- tapOn: "Turn on nudges"
- tapOn: "Start exploring"
- takeScreenshot: e2e-shots/after-onboarding
# The county's list loads from the live backend after onboarding.
- extendedWaitUntil:
    visible:
      id: "thisweek-row-0"
    timeout: 60000
- takeScreenshot: e2e-shots/this-week
