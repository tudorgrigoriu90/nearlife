name: Catch spots

# Fetches catch spots from OpenStreetMap via Overpass (T-046 · T-049): designated public places
# (viewpoints, picnic sites, shelters, parks, trailheads, bird hides, beaches, bathing and fishing
# places), each with a habitat (land / freshwater / coast) and any exclusion flags. Output is an
# artifact; loading into Supabase is T-048. Overpass is a shared community service: one county
# at a time, paced, yearly.
#
# Map data © OpenStreetMap contributors (ODbL). The derived data stays internal (T-008).

on:
  schedule:
    - cron: "23 4 12 2 *" # 12 February, yearly: OSM changes slowly, and a week after the data pipeline
  workflow_dispatch:
    inputs:
      counties:
        description: "ISO 3166-2 codes, space-separated (e.g. SE-G), or empty for all 21"
        required: false
        default: ""

concurrency:
  group: catch-spots
  cancel-in-progress: false

jobs:
  # One job per county, one at a time. A single county took 15 min in the first run (Kronoberg,
  # 2026-10-30), so all 21 in one job could pass the 6 h job limit; separate jobs each get their own.
  # max-parallel 1 keeps us to one query at a time on the shared Overpass server.
  plan:
    name: Pick counties
    runs-on: ubuntu-latest
    outputs:
      counties: ${{ steps.pick.outputs.counties }}
    steps:
      - id: pick
        env:
          COUNTIES: ${{ inputs.counties }}
        run: |
          ALL="SE-K SE-W SE-X SE-I SE-N SE-Z SE-F SE-H SE-G SE-BD SE-T SE-E SE-M SE-D SE-AB SE-C SE-S SE-AC SE-Y SE-U SE-O"
          LIST="${COUNTIES:-$ALL}"
          JSON=$(printf '%s\n' $LIST | grep -E '^SE-[A-Z]{1,2}$' | jq -R . | jq -cs .)
          echo "counties=$JSON" >> "$GITHUB_OUTPUT"

  spots:
    name: Fetch catch spots (${{ matrix.county }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        county: ${{ fromJson(needs.plan.outputs.counties) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      - name: Fetch from Overpass
        env:
          COUNTY: ${{ matrix.county }}
        run: python pipeline/build_catch_spots.py "$COUNTY"

      - name: Upload the spots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: catch-spots-${{ matrix.county }}
          path: pipeline/data/catch_spots_*.json
          retention-days: 90
