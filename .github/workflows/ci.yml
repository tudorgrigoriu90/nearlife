name: CI

# Authoritative quality gate (see CLAUDE.md). Runs the verify pipeline (lint +
# typecheck + test) and the Python pipeline checks on every push to main and on
# every PR. There is no local pre-push hook anymore (removed in T-142) — run
# `npm run verify` locally before pushing, since pushes go straight to main and
# this reports (does not block) a red main.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run quality gate
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run verify:ci
          else
            echo "No package.json yet — code checks activate after T-010 (app scaffold)."
          fi

      - name: Set up Python
        if: hashFiles('pipeline/requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run pipeline checks (lint + test)
        if: hashFiles('pipeline/requirements.txt') != ''
        run: |
          pip install -r pipeline/requirements.txt
          python -m pytest pipeline -q
