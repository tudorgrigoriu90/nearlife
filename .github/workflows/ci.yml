name: CI

# Authoritative quality gate (see CLAUDE.md). Runs the verify pipeline (lint +
# typecheck + test) and the Python pipeline checks on every push to main and on
# every PR. There is no local pre-push hook anymore (removed in T-142) — run
# `npm run verify` locally before pushing, since pushes go straight to main and
# this reports (does not block) a red main.

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default (T-303 · review B-69); a job that needs more says so.
permissions:
  contents: read

jobs:
  verify:
    name: Verify (lint + typecheck + test)
    runs-on: ubuntu-latest
    # A throwaway Postgres for the database-rule tests (pipeline/tests/pg_harness.py, T-266): the
    # free-catch trigger and other rules are tested against the repository's own migrations.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nearby_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nearby_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nearby_test" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Run quality gate
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run verify:ci
          else
            echo "No package.json yet — code checks activate after T-010 (app scaffold)."
          fi

      # T-289 · review I-16: high and critical advisories in the shipped dependency tree fail the
      # job unless audit-accepted.json accepts each one with a reason.
      - name: Dependency audit
        run: node scripts/auditGate.js

      # Tests run components in Jest, which does not bundle; a module Metro cannot resolve or a
      # native-only import used at module level only shows up when the real bundle is built.
      - name: Build the Android bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-export"

      - name: Set up Python
        if: hashFiles('pipeline/requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Run pipeline checks (lint + test)
        if: hashFiles('pipeline/requirements.txt') != ''
        env:
          NEARBY_PG_TEST_URL: postgresql://nearby_test:test@localhost:5432/nearby_test
        run: |
          pip install -r pipeline/requirements.txt
          python -m pytest pipeline -q
