name: Data pipeline

# Operationalises the E3 national data load (T-042/T-134/T-135/T-119) as a manual workflow, so it
# runs from GitHub with secrets rather than Python on someone's laptop. Content generation always
# runs (no secrets needed); the Supabase load + photo upload run only when the corresponding repo
# secrets are set. Manual-only (workflow_dispatch) — it makes external API calls and DB writes, so
# it never fires automatically.
#
# Repo secrets (Settings → Secrets and variables → Actions), all optional:
#   SUPABASE_DB_URL       privileged Postgres connection string   → load species/presence (T-134)
#   SUPABASE_URL          https://<ref>.supabase.co               → photo upload target (T-119)
#   SUPABASE_SERVICE_KEY  a secret key (`sb_secret_…`)             → photo upload auth (T-119)

on:
  workflow_dispatch:
    inputs:
      vernacular:
        description: "Fetch vernacular names for the shipped species (resumable, ~40 min): 'yes' or empty to skip"
        required: false
        default: ""
      countries:
        description: "Presence ingest: space-separated ISO3 codes (SWE NOR DNK FIN ISL), or empty to skip the ingest"
        required: false
        default: ""
      content_scope:
        description: "Content generation scope: 'all' (~12k species, ~hours), a single presence file name, or 'skip'"
        required: false
        default: "all"

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: Generate + load national data
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Seconds, and it runs first on purpose: the load steps are silently skipped when their
      # secret is missing, and that only becomes visible hours later, at the end of an ingest that
      # then has nowhere to write. Names only — never the values.
      - name: Preflight — which destinations are configured
        run: |
          for v in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_KEY; do
            if [ -n "${!v}" ]; then echo "$v: set"; else echo "$v: MISSING — its load step will be skipped"; fi
          done
          echo "countries='${{ inputs.countries }}' content_scope='${{ inputs.content_scope }}'"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline deps
        run: pip install -r pipeline/requirements.txt

      # GBIF ingest. Hours per country (regions x 12 months x taxa, politely paced), which is why
      # it lives here rather than on a laptop or in a chat session: Actions can run for six hours
      # unattended and the output is committed as an artifact either way.
      - name: Ingest presence from GBIF
        if: ${{ inputs.countries != '' }}
        run: |
          for c in ${{ inputs.countries }}; do
            echo "::group::presence ingest $c"
            python pipeline/build_presence.py --all --country "$c"
            echo "::endgroup::"
          done

      # Resumable and incremental (T-188): a re-run picks up where the last stopped, so a
      # timeout or a failed species costs minutes rather than the whole pass. Runs before content
      # generation, which reads data/vernacular.json to fill each row's common_name.
      - name: Fetch vernacular names (T-188)
        if: ${{ !cancelled() && inputs.vernacular != '' }}
        run: python pipeline/build_vernacular.py

      - name: Generate species content (grounded facts + safe templates, T-135)
        if: ${{ inputs.content_scope != 'skip' }}
        run: |
          if [ "${{ inputs.content_scope }}" = "all" ]; then
            python pipeline/build_content.py --all
          else
            python pipeline/build_content.py "pipeline/data/${{ inputs.content_scope }}"
          fi

      - name: Refresh curated photo manifest (T-119)
        if: ${{ !cancelled() }}
        run: python pipeline/build_kronoberg_media.py

      # Everything below runs even when a step above failed. build_presence.py exits 1 if any
      # single taxon failed, but the taxa that succeeded are already written to disk — discarding
      # a five-hour run because insects timed out is the wrong trade. `!cancelled()` rather than
      # `always()`, so an explicit cancel still stops the DB writes.
      - name: Upload generated data as an artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-data
          path: pipeline/data/*.json
          retention-days: 14

      - name: Load species + presence into Supabase (T-134)
        if: ${{ !cancelled() && env.SUPABASE_DB_URL != '' }}
        working-directory: pipeline
        run: python -m gbif.supabase_load

      - name: Upload curated photos to Supabase Storage (T-119)
        if: ${{ !cancelled() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_KEY != '' }}
        run: python pipeline/media/supabase_upload.py
