name: Deploy Edge Functions

# T-206. Redeploys `send-notifications` and `revenuecat-webhook` (T-217) whenever their code changes
# on main, so the server never quietly runs older rules than the repo. Before this, a change to lib/pushDispatch.ts
# needed a manual redeploy through the Supabase connector.
#
# Needs the repo secret SUPABASE_ACCESS_TOKEN (a Supabase personal access token, `sbp_…`).
#
# `delete-account` (T-093, Director approved 2026-10-31) is deployed WITH JWT verification: only a
# signed-in user can call it, and it deletes only that user.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: subjdoiicfmiimtvlzsg
    steps:
      - uses: actions/checkout@v4

      - name: Check the access token is configured
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repo secret SUPABASE_ACCESS_TOKEN is missing — create one at https://supabase.com/dashboard/account/tokens"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Never ship a stale copy of the engine: regenerate it and fail if it differs from what is
      # committed (the same check CI runs as a test, repeated here because this job does not wait
      # for CI).
      - name: Check the shared engine copy is current
        run: |
          npm ci
          node scripts/edgeShared.js
          git diff --exit-code -- supabase/functions/_shared

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt: neither caller has a user JWT. pg_cron calls send-notifications, which
      # checks x-cron-secret; RevenueCat calls revenuecat-webhook, which checks its bearer secret.
      # --use-api bundles server-side, so the runner needs no Docker.
      - name: Deploy
        run: |
          for fn in send-notifications revenuecat-webhook; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
          supabase functions deploy delete-account --project-ref "$PROJECT_REF" --use-api

  # T-093: prove account deletion works end to end after every deploy, on a throwaway anonymous
  # account. Only the public publishable key is used (the app ships it); the function itself checks
  # who is calling.
  smoke-delete-account:
    name: Account deletion works
    needs: deploy
    runs-on: ubuntu-latest
    env:
      URL: https://subjdoiicfmiimtvlzsg.supabase.co
      KEY: sb_publishable_Wq-K09KGV8IDchkTicCkLA_22F8f5GB
    steps:
      - name: Sign in anonymously, delete the account, confirm it is gone
        run: |
          set -euo pipefail
          token=$(curl -sS -X POST "$URL/auth/v1/signup" -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"data":{}}' | jq -r .access_token)
          [ -n "$token" ] && [ "$token" != null ] || { echo "::error::anonymous sign-in failed"; exit 1; }

          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL/functions/v1/delete-account" -H "apikey: $KEY")
          [ "$code" = 401 ] || { echo "::error::without a session the function answered $code, not 401"; exit 1; }

          body=$(curl -sS -X POST "$URL/functions/v1/delete-account" -H "apikey: $KEY" -H "Authorization: Bearer $token")
          echo "delete-account: $body"
          [ "$(echo "$body" | jq -r .ok)" = true ] || { echo "::error::deletion failed: $body"; exit 1; }

          after=$(curl -sS -o /dev/null -w '%{http_code}' "$URL/auth/v1/user" -H "apikey: $KEY" -H "Authorization: Bearer $token")
          [ "$after" != 200 ] || { echo "::error::the deleted account's session still works"; exit 1; }
          echo "deleted account rejected with $after"
