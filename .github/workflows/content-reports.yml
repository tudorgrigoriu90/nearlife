name: Content reports

# The week's "Report a mistake" reports (T-293 · review I-32, pipeline/db/content_reports.py):
# grouped by species, most reported first, in this run's summary. Read-only. Users may send
# reports but never read them; this is how they reach whoever fixes the content.
#
# Secrets: SUPABASE_DB_URL (read-only query).

on:
  schedule:
    - cron: "47 6 * * 1" # Mondays, 06:47 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to list"
        required: false
        default: "7"

concurrency:
  group: content-reports
  cancel-in-progress: true

jobs:
  reports:
    name: List the week's reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      # The input is free text, so it reaches the shell through env, never `${{ }}` interpolation.
      - name: List
        working-directory: pipeline
        env:
          REPORT_DAYS: ${{ inputs.days }}
        run: python -m db.content_reports
