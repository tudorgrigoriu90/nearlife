name: Species names

# Fills species names GBIF lacks from Wikidata, in every app language (T-258), straight into the
# empty species_content.common_name slots. Names already there are never overwritten. A few
# minutes. Monthly, since Wikidata keeps growing; also on demand.
#
# Then resolves species Wikipedia files under another name (T-260): fact, names and photo through
# the better-known name, empty slots only.
#
# Secrets: SUPABASE_DB_URL, SUPABASE_URL + SUPABASE_SERVICE_KEY (photo upload).

on:
  schedule:
    - cron: "37 4 3 * *" # the 3rd of each month, 04:37 UTC
  workflow_dispatch:

# Read-only token by default (T-303 · review B-69); a job that needs more says so.
permissions:
  contents: read

concurrency:
  group: species-names
  cancel-in-progress: false

jobs:
  names:
    name: Fill names from Wikidata
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r pipeline/requirements.txt

      # T-373: one species under two GBIF keys is merged into the accepted key first, so the
      # steps below fill one card, not two.
      - name: Merge duplicate species (T-373)
        run: python pipeline/merge_duplicates.py --apply

      - name: Fill names
        if: always()
        run: python pipeline/build_wikidata_names.py --load

      - name: Resolve species filed under another name (T-260)
        if: always()
        run: python pipeline/resolve_synonyms.py

      - name: Worldwide threat status from Wikidata (T-263)
        if: always()
        run: python pipeline/build_iucn_status.py

      # GBIF, CC0 (DATA-SOURCING §9). Refuses to clear the column if the answer comes back short.
      - name: Threat status in Sweden from the Swedish Red List (T-332)
        if: always()
        run: python pipeline/build_redlist_se.py

      # GBIF, CC0 (DATA-SOURCING §10). Refuses to clear the marks if the answer comes back short.
      - name: Invasive species of Union concern (T-336)
        if: always()
        run: python pipeline/build_legal_status.py
